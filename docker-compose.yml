services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: katalog-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: katalog-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5297}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      # Database
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-KatalogDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      # JWT
      Jwt__Key: "${JWT_KEY:-${Jwt__Key:-}}"
      Jwt__Issuer: "${JWT_ISSUER:-${Jwt__Issuer:-KatalogBackend}}"
      Jwt__Audience: "${JWT_AUDIENCE:-${Jwt__Audience:-KatalogClient}}"
      Jwt__ExpireTime: "${JWT_EXPIRE_TIME:-${Jwt__ExpireTime:-60}}"
      # Cloudinary
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-${Cloudinary__CloudName:-}}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-${Cloudinary__ApiKey:-}}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-${Cloudinary__ApiSecret:-}}"
      # Azure Service Bus
      AzureServiceBus__ConnectionString: "${AZURE_SERVICE_BUS_CONNECTION_STRING:-${AzureServiceBus__ConnectionString:-}}"
      AzureServiceBus__TopicName: "${AZURE_SERVICE_BUS_TOPIC:-${AzureServiceBus__TopicName:-order-placed-topic}}"
      AzureServiceBus__SubscriptionName: "${AZURE_SERVICE_BUS_SUBSCRIPTION:-${AzureServiceBus__SubscriptionName:-order-stock-worker-sub}}"
      # Background Services: Disabled on API so it only serves HTTP traffic
      Consumer__Enabled: "false"
      OutboxPublisher__Enabled: "false"
    restart: unless-stopped

  consumer:
    build: .
    container_name: katalog-consumer
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      # Database
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-KatalogDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      # Azure Service Bus
      AzureServiceBus__ConnectionString: "${AZURE_SERVICE_BUS_CONNECTION_STRING:-${AzureServiceBus__ConnectionString:-}}"
      AzureServiceBus__TopicName: "${AZURE_SERVICE_BUS_TOPIC:-${AzureServiceBus__TopicName:-order-placed-topic}}"
      AzureServiceBus__SubscriptionName: "${AZURE_SERVICE_BUS_SUBSCRIPTION:-${AzureServiceBus__SubscriptionName:-order-stock-worker-sub}}"
      # Background Services: Enabled on worker
      Consumer__Enabled: "true"
      OutboxPublisher__Enabled: "true"
    restart: unless-stopped

volumes:
  sqlserver_data:
