name: katalog-backend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: "Release"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore Katalog-Backend.slnx

      - name: Build
        run: dotnet build Katalog-Backend.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test Katalog-Backend.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal
