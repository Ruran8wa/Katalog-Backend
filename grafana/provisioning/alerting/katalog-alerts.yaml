apiVersion: 1

groups:
  - orgId: 1
    name: Katalog order processing
    folder: Katalog
    interval: 1m
    rules:
      - uid: katalog-pending-orders
        title: Orders have stayed Pending
        condition: pending-orders
        for: 2m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Orders have remained Pending for more than two minutes
          description: The Pending order backlog is {{ $values.pending.Value }}. Check the consumer, Service Bus, and database.
        labels:
          severity: warning
          service: katalog-backend
        data:
          - refId: pending-orders
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: katalog_orders_pending
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: pending-orders
