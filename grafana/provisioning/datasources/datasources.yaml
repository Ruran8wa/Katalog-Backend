apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
        tags:
          - trace_id
          - span_id
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id["=: ]+([a-f0-9]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
        - name: SpanID
          matcherRegex: 'span_id["=: ]+([a-f0-9]{16})'
          url: 'http://tempo:3200/trace/$${__value.raw}'
